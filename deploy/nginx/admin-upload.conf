# Flask enforces the configured batch limit (up to 1 GiB plus multipart overhead).
# The browser uploads one song per request; native forms may send batches.
location ~ ^/admin/stations/[a-z0-9-]+/media/upload$ {
    client_max_body_size 1025m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
