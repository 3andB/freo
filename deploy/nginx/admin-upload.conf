# Flask enforces the configured batch limit (up to 1 GiB plus multipart overhead).
# The browser uploads one song per request; native forms may send batches.
location ~ ^/admin/stations/[a-z0-9-]+/media/upload$ {
    client_max_body_size 1025m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Review-workspace uploads send one song (up to 128 MiB) plus multipart overhead.
location ~ ^/admin/api/stations/[a-z0-9-]+/imports/[a-f0-9-]+/files$ {
    client_max_body_size 129m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Cropped artwork can exceed the default body limit. Flask caps images at 20 MiB.
location ~ ^/admin/api/stations/[a-z0-9-]+/artwork$ {
    client_max_body_size 21m;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
