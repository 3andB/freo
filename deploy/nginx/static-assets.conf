# Public release assets only: compress text without changing streaming responses.
location /static/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    expires 1h;
}
