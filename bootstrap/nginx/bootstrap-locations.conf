# REVIEWED CONFIGURATION TEMPLATE ONLY. Not installed on freo.world.
# Include inside an existing HTTPS server block on the isolated delivery host.
# /srv/freo-bootstrap and its parents: root-owned 0755; install.sh: root-owned 0644.
location = /install {
    alias /srv/freo-bootstrap/install.sh;
    types { }
    default_type "text/plain; charset=utf-8";
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    limit_except GET { deny all; }
}
location = /install.sh {
    alias /srv/freo-bootstrap/install.sh;
    types { }
    default_type "text/plain; charset=utf-8";
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    limit_except GET { deny all; }
}
