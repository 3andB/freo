name: Build signed release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate:
        description: Build a private candidate from develop/v1 (no tag or release index)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/recovery.yml
  dependency-tests:
    uses: ./.github/workflows/python-install.yml
  package:
    needs: [tests, dependency-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare builder
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv nginx gnupg postgresql postgresql-client curl
          python3 -m venv venv
          venv/bin/pip install -r requirements.txt
      - name: Build complete release with hashed wheels
        run: |
          mkdir -p "$RUNNER_TEMP/freo-release"
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.candidate }}" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/develop/v1 ]] || { echo 'Candidates require develop/v1'; exit 1; }
            version=$(venv/bin/python -c 'from app.version import VERSION; print(VERSION)')
            [[ "$version" =~ ^1\.0\.0-rc\.[0-9]+$ ]] || exit 1
            artifact="freo-v${version}.tar.gz"
            venv/bin/python scripts/build-release.py --candidate --output "$RUNNER_TEMP/freo-release/$artifact"
            echo 'FREO_PRIVATE_CANDIDATE=1' >> "$GITHUB_ENV"
          else
            [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'Release builds require a version tag'; exit 1; }
            artifact="freo-${GITHUB_REF_NAME}.tar.gz"
            venv/bin/python scripts/build-release.py --output "$RUNNER_TEMP/freo-release/$artifact"
          fi
          echo "FREO_ARTIFACT=$artifact" >> "$GITHUB_ENV"
      - name: Test the actual archive offline before signing
        run: |
          mkdir "$RUNNER_TEMP/packaged-source"
          tar -xzf "$RUNNER_TEMP/freo-release/$FREO_ARTIFACT" -C "$RUNNER_TEMP/packaged-source"
          bash "$RUNNER_TEMP/packaged-source/scripts/install-python.sh" "$RUNNER_TEMP/packaged-source" "$RUNNER_TEMP/packaged-venv" --offline
          sudo python3 scripts/test-install-postgres.py "$RUNNER_TEMP/packaged-source" "$RUNNER_TEMP/packaged-venv" "$RUNNER_TEMP/package-install-evidence"
      - name: Sign candidate and generate common website/API index
        env:
          FREO_RELEASE_SIGNING_KEY: ${{ secrets.FREO_RELEASE_SIGNING_KEY }}
          FREO_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.FREO_RELEASE_SIGNING_PASSPHRASE }}
          FREO_RELEASE_SIGNING_FINGERPRINT: ${{ vars.FREO_RELEASE_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$FREO_RELEASE_SIGNING_KEY"
          test -n "$FREO_RELEASE_SIGNING_FINGERPRINT"
          freo_gpg_home=$(mktemp -d)
          trap 'gpgconf --homedir "$freo_gpg_home" --kill gpg-agent; rm -rf -- "$freo_gpg_home"' EXIT
          chmod 700 "$freo_gpg_home"
          printf '%s' "$FREO_RELEASE_SIGNING_KEY" | gpg --homedir "$freo_gpg_home" --batch --import
          freo_artifact="$RUNNER_TEMP/freo-release/$FREO_ARTIFACT"
          printf '%s\n' "$FREO_RELEASE_SIGNING_PASSPHRASE" | gpg --homedir "$freo_gpg_home" --batch --pinentry-mode loopback --passphrase-fd 0 --local-user "$FREO_RELEASE_SIGNING_FINGERPRINT" --armor --detach-sign --output "${freo_artifact}.asc" "$freo_artifact"
          gpg --homedir "$freo_gpg_home" --batch --export "$FREO_RELEASE_SIGNING_FINGERPRINT" > "$RUNNER_TEMP/freo-release/publisher.gpg"
          if [[ "${FREO_PRIVATE_CANDIDATE:-0}" != 1 ]]; then
            venv/bin/python scripts/release-index.py "$freo_artifact" --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$FREO_ARTIFACT" --output "$RUNNER_TEMP/freo-release/latest.json"
          fi
          gpgv --keyring "$RUNNER_TEMP/freo-release/publisher.gpg" "${freo_artifact}.asc" "$freo_artifact"
          cd "$RUNNER_TEMP/freo-release"
          sha256sum "$FREO_ARTIFACT" > SHA256SUMS
          if [[ "${FREO_PRIVATE_CANDIDATE:-0}" == 1 ]]; then
            freo_version="${FREO_ARTIFACT#freo-v}"
            freo_version="${freo_version%.tar.gz}"
            freo_kit="freo-v${freo_version}-install-kit.tar"
            freo_doc="v1-${freo_version#1.0.0-}-installation.md"
            freo_doc="${freo_doc/rc./rc}"
            cp "$GITHUB_WORKSPACE/docs/$freo_doc" INSTALL.md
            cp "$GITHUB_WORKSPACE/docs/$freo_doc" "$freo_doc"
            tar -cf "$freo_kit" "$FREO_ARTIFACT" "${FREO_ARTIFACT}.asc" publisher.gpg SHA256SUMS INSTALL.md
            printf '%s\n' "$FREO_RELEASE_SIGNING_PASSPHRASE" | gpg --homedir "$freo_gpg_home" --batch --pinentry-mode loopback --passphrase-fd 0 --local-user "$FREO_RELEASE_SIGNING_FINGERPRINT" --armor --detach-sign --output "${freo_kit}.asc" "$freo_kit"
            sha256sum "$freo_kit" > "freo-v${freo_version}-install-kit.sha256"
            gpgv --keyring publisher.gpg "${freo_kit}.asc" "$freo_kit"
            sha256sum --check "freo-v${freo_version}-install-kit.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freo-signed-release-candidate
          path: ${{ runner.temp }}/freo-release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: package-install-evidence
          path: ${{ runner.temp }}/package-install-evidence/
          retention-days: 30
