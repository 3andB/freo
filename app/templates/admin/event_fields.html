<div class="event-form-grid">
<label>Name<input name="name" maxlength="120" required value="{{ event.name if event else '' }}"></label>
<label>Description<input name="description" maxlength="500" value="{{ event.description if event else '' }}"></label>
<label>Recurrence<select name="recurrence_type" id="event-recurrence"><option value="ONE_TIME" {% if event and event.recurrence_type == 'ONE_TIME' %}selected{% endif %}>Once</option><option value="WEEKLY" {% if event and event.recurrence_type == 'WEEKLY' %}selected{% endif %}>Repeat weekly</option></select></label>
<label data-event-once>Date<input type="date" name="local_date" value="{{ event_local.date().isoformat() if event_local is defined and event_local else request.args.get('date','') }}"></label>
<fieldset data-event-weekly><legend>Repeat on</legend><input type="hidden" name="repeat_days_present" value="1"><div class="weekday-picker">{% for name in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'] %}<label><input type="checkbox" name="weekdays" value="{{ loop.index0 }}" {% if event and loop.index0 in event.repeat_days %}checked{% endif %}>{{ name }}</label>{% endfor %}</div><small>Changes apply to this entire series. Past airplay stays recorded.</small></fieldset>
<label>Time · {{ selected.timezone }}<input type="time" step="1" name="local_time" required value="{{ event.local_time.strftime('%H:%M:%S') if event and event.local_time else event_local.strftime('%H:%M:%S') if event_local is defined and event_local else '' }}"></label>
<label>Content kind<select name="content_type" id="event-content"><option value="TRACK" {% if event and event.track %}selected{% endif %}>Song</option><option value="IMAGING_ASSET" {% if event and event.imaging_asset %}selected{% endif %}>ID, announcement, or commercial</option><option value="EVENT_BLOCK" {% if event and event.event_block %}selected{% endif %}>Sequence</option></select></label>
<label>Approved content<select name="content_identifier" required><option value="">Choose audio</option><optgroup label="Songs">{% for track in tracks %}<option data-content-type="TRACK" value="{{ track.uuid }}" {% if event and event.track_id == track.id %}selected{% endif %}>{{ track.title }} — {{ track.artist }}</option>{% endfor %}</optgroup><optgroup label="Imaging">{% for asset in imaging %}<option data-content-type="IMAGING_ASSET" value="{{ asset.uuid }}" {% if event and event.imaging_asset_id == asset.id %}selected{% endif %}>{{ asset.cart_code or asset.asset_type }} — {{ asset.name }}</option>{% endfor %}</optgroup><optgroup label="Sequences">{% for block in blocks %}<option data-content-type="EVENT_BLOCK" value="{{ block.slug }}" {% if event and event.event_block_id == block.id %}selected{% endif %}>{{ block.name }}</option>{% endfor %}</optgroup></select></label>
<label>Timing<select name="timing_mode">{% for value, label in [('SOFT','After the current song'),('NON_INTERRUPTING','When the queue is clear'),('HARD','Interrupt automated music')] %}<option value="{{ value }}" {% if event and event.timing_mode == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><small>After the current song aims for the first available boundary at or after the target. DJ audio and active sequences stay protected.</small></label>
<label>Play up to this many seconds late<input type="number" name="late_tolerance_seconds" min="1" max="86400" required value="{{ event.late_tolerance_seconds if event else 300 }}"><small>300 seconds = five minutes. After this allowance, mark missed.</small></label>
<details class="event-options"><summary>Advanced timing</summary><div class="event-form-grid">
<label>Allow early playback (seconds)<input type="number" name="early_tolerance_seconds" min="0" max="3600" value="{{ event.early_tolerance_seconds if event else 0 }}"><small>Zero means never intentionally start before the target.</small></label>
<label>Missed policy<select name="missed_policy">{% for value in missed %}<option value="{{ value }}" {% if event and event.missed_policy == value %}selected{% endif %}>{{ value.replace('_',' ')|title }}</option>{% endfor %}</select><small>Both policies remain bounded by the late allowance.</small></label>
<label>Interruption permission<select name="interrupt_policy">{% for value in interrupts %}<option value="{{ value }}" {% if event and event.interrupt_policy == value %}selected{% endif %}>{{ value.replace('_',' ')|title }}</option>{% endfor %}</select><small>Only the interrupt timing mode may cut automated music.</small></label>
<label>Priority<input type="number" name="priority" min="0" max="1000" value="{{ event.priority if event else 100 }}"><small>Higher priority goes first at the same target time.</small></label>
</div></details></div>
