<div class="event-form-grid"><label>Name<input name="name" maxlength="120" required value="{{ event.name if event else '' }}"></label><label>Description<input name="description" maxlength="500" value="{{ event.description if event else '' }}"></label>
<label>Timing behavior<select name="timing_mode">{% for value in modes %}<option value="{{ value }}" {% if event and event.timing_mode == value %}selected{% endif %}>{{ value.replace('_',' ') }}</option>{% endfor %}</select><small>HARD may cut permitted automated music. Other modes never cut current audio.</small></label>
<label>Recurrence<select name="recurrence_type" id="event-recurrence">{% for value in recurrences %}<option value="{{ value }}" {% if event and event.recurrence_type == value %}selected{% endif %}>{{ value.replace('_',' ') }}</option>{% endfor %}</select></label>
<label>One-time date<input type="date" name="local_date" value="{{ event_local.date().isoformat() if event_local is defined and event_local else '' }}"></label>
<label>Weekday<select name="weekday">{% for day in range(7) %}<option value="{{ day }}" {% if event and event.weekday == day %}selected{% endif %}>{{ ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][day] }}</option>{% endfor %}</select></label>
<label>Station-local time<input type="time" step="1" name="local_time" required value="{{ event.local_time.strftime('%H:%M:%S') if event and event.local_time else event_local.strftime('%H:%M:%S') if event_local is defined and event_local else '' }}"></label>
<label>Content kind<select name="content_type" id="event-content"><option value="TRACK" {% if event and event.track %}selected{% endif %}>Track</option><option value="IMAGING_ASSET" {% if event and event.imaging_asset %}selected{% endif %}>Imaging asset</option><option value="EVENT_BLOCK" {% if event and event.event_block %}selected{% endif %}>Event block</option></select></label>
<label>Approved content<select name="content_identifier" required><optgroup label="Tracks">{% for track in tracks %}<option value="{{ track.uuid }}" {% if event and event.track_id == track.id %}selected{% endif %}>{{ track.title }} — {{ track.artist }}</option>{% endfor %}</optgroup><optgroup label="Imaging">{% for asset in imaging %}<option value="{{ asset.uuid }}" {% if event and event.imaging_asset_id == asset.id %}selected{% endif %}>{{ asset.cart_code or asset.asset_type }} — {{ asset.name }}</option>{% endfor %}</optgroup><optgroup label="Blocks">{% for block in blocks %}<option value="{{ block.slug }}" {% if event and event.event_block_id == block.id %}selected{% endif %}>{{ block.block_type.replace('_',' ') }} — {{ block.name }}</option>{% endfor %}</optgroup></select></label>
<label>Early tolerance (seconds)<input type="number" name="early_tolerance_seconds" min="0" max="3600" value="{{ event.early_tolerance_seconds if event else 0 }}"></label><label>Late tolerance (seconds)<input type="number" name="late_tolerance_seconds" min="1" max="86400" value="{{ event.late_tolerance_seconds if event else 10 }}"></label>
<label>Missed policy<select name="missed_policy">{% for value in missed %}<option value="{{ value }}" {% if event and event.missed_policy == value %}selected{% endif %}>{{ value.replace('_',' ') }}</option>{% endfor %}</select></label><label>Interrupt policy<select name="interrupt_policy">{% for value in interrupts %}<option value="{{ value }}" {% if event and event.interrupt_policy == value %}selected{% endif %}>{{ value.replace('_',' ') }}</option>{% endfor %}</select></label>
<label>Priority<input type="number" name="priority" min="0" max="1000" value="{{ event.priority if event else 100 }}"><small>Higher priority wins a collision.</small></label></div>
