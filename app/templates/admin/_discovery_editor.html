{% from 'admin/_discovery_fields.html' import fields with context %}
{% if item.station_id == selected.id %}

<form method="post" action="{{ url_for('platform_polish.discovery',slug=selected.slug,kind=kind,identifier=item.id) }}">

</form></section>
{% endif %}
