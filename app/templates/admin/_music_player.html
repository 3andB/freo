<section id="music-player" class="music-player" aria-label="Private song preview" hidden>
  <button type="button" id="preview-toggle" aria-label="Play preview">▶</button>
  <div class="preview-copy"><b id="preview-title">Choose a song</b><span id="preview-artist"></span></div>
  <span id="preview-elapsed">0:00</span><input id="preview-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek within preview"><span id="preview-duration">0:00</span>
  <label class="preview-normalize"><input type="checkbox" id="preview-normalized" checked> Normalized <small id="preview-gain"></small></label>
  <label class="preview-volume">Volume<input id="preview-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Preview volume"></label>
  <p id="preview-error" role="status" hidden></p><audio id="music-audio" preload="none"></audio>
</section>
