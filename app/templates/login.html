{% extends 'base.html' %}
{% block title %}Admin sign in — Freo{% endblock %}
{% block content %}<section class="section shell narrow"><div class="section-head"><p class="eyebrow">AUTHENTICATED STATION ADMIN</p><h1>Sign in</h1><p>Sign in to manage your stations.</p></div><form class="login-card" method="post" autocomplete="on"><input type="hidden" name="csrf" value="{{ csrf }}">{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<label>Username or email<input name="email" type="text" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="ui-primary button" type="submit">Sign in</button></form></section>{% endblock %}
