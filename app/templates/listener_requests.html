<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a song · {{ station.name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='listener_requests.css') }}"><script defer src="{{ url_for('static', filename='uuid.js',v='v1-http') }}"></script><script defer src="{{ url_for('static', filename='listener_requests.js',v='v1-http') }}"></script></head>
<body><main id="requests" data-api="{{ url_for('listener_requests.public_api', slug=station.public_slug or station.slug) }}" data-enabled="{{ 'yes' if enabled else 'no' }}"><h1>Request a song</h1><p>{{ station.name }}</p>
{% if enabled %}<p>Choose a song for a future music slot. Programming and recent plays may mean a wait. Requests expire after 24 hours.</p><form id="search"><label for="query">Song or artist</label><div><input id="query" type="search" maxlength="100"><button>Search</button></div></form><p id="notice" role="status" aria-live="polite"></p><ul id="songs"></ul><nav aria-label="Search pages"><button id="previous" type="button" disabled>Previous</button><button id="next" type="button" disabled>Next</button></nav>{% else %}<p>Requests are currently disabled.</p>{% endif %}</main></body></html>
